# Render blueprint: a single web service. The weekly refresh runs inside the
# service via the built-in scheduler in app.py (ENABLE_SCHEDULER=1), because
# separate Render services do not share a filesystem, so a cron service could
# not hand its rankings.json to the API.
#
# Deploy: push to GitHub, then Render Dashboard > New > Blueprint > this repo.
# Render provides HTTPS automatically.
services:
  - type: web
    name: quantapp-api
    runtime: docker
    # starter = 512MB, $7/mo. Measured peak is ~383MB: the API process idles at
    # ~20MB and the weekly job subprocess peaks at ~363MB, so this fits with
    # roughly 130MB spare. If a Saturday run ever gets OOM-killed the previous
    # rankings.json keeps serving, so the fallback is stale data, not an outage.
    # Bump to `standard` (2GB, $25/mo) if that happens.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENABLE_SCHEDULER
        value: "1"
