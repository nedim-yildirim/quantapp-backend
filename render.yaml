# Render blueprint: a single web service. The weekly refresh runs on GitHub
# Actions and commits data/rankings.json; each push redeploys this service.
#
# Deploy: push to GitHub, then Render Dashboard > New > Blueprint > this repo.
# Render provides HTTPS automatically.
services:
  - type: web
    name: quantapp-api
    runtime: docker
    # starter = 512MB, $7/mo. Measured peak is ~383MB: the API process idles at
    # ~20MB and the weekly job subprocess peaks at ~363MB, so this fits with
    # roughly 130MB spare. If a Saturday run ever gets OOM-killed the previous
    # rankings.json keeps serving, so the fallback is stale data, not an outage.
    # Bump to `standard` (2GB, $25/mo) if that happens.
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The weekly refresh moved to .github/workflows/weekly-update.yml, which
      # commits the snapshot. An in-process run would write to the ephemeral
      # disk and be lost on the next deploy, and risked an OOM kill of the API.
      - key: ENABLE_SCHEDULER
        value: "0"
